<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotoba · Japanese and Chinese vocab trainer</title>
  <meta name="description" content="Look up Japanese and Chinese words, collect the ones you want to learn, and quiz yourself with spaced repetition.">
  <meta name="theme-color" content="#ff634a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // Pick light or dark before the page draws, so it never flashes the wrong one.
    // js/theme.js keeps it up to date after that.
    (function () {
      var choice = null;
      try { choice = localStorage.getItem('kotoba:theme'); } catch (e) { /* storage blocked */ }
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <!-- The brand glyph, the tabs and the language toggle are built by js/app.js from the
         language on show (js/lang/*.js), so they change with it. -->
    <a class="brand" id="brand" href="#/ja/dictionary">
      <span class="brand-mark" id="brand-mark" lang="ja" aria-hidden="true">言</span>
      <span>Kotoba</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <nav class="lang-toggle" id="lang-toggle" aria-label="Language"></nav>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Kotoba needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
