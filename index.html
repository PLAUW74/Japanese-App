<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotoba · Japanese dictionary and vocab trainer</title>
  <meta name="description" content="Look up Japanese words, collect the ones you want to learn, and quiz yourself with spaced repetition.">
  <meta name="theme-color" content="#c8402f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // Pick light or dark before the page draws, so it never flashes the wrong one.
    // js/theme.js keeps it up to date after that.
    (function () {
      var choice = null;
      try { choice = localStorage.getItem('kotoba:theme'); } catch (e) { /* storage blocked */ }
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dictionary">
      <span class="brand-mark" lang="ja" aria-hidden="true">言</span>
      <span>Kotoba</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#/dictionary" data-tab="dictionary">Dictionary</a>
      <a href="#/words" data-tab="words">My Words</a>
      <a href="#/quiz" data-tab="quiz">Quiz <span class="tab-badge" id="due-badge" hidden></span></a>
      <a href="#/notes" data-tab="notes">Notes</a>
      <a href="#/reading" data-tab="reading">Reading</a>
      <a href="#/stats" data-tab="stats">Stats</a>
    </nav>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Kotoba needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
